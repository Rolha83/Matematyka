<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprawdzian z Matematyki - Klasa II (Wiosna 2024)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .task {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .task-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        .correct-answer {
            background-color: #d4edda !important;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrect-answer {
            background-color: #f8d7da !important;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #219150;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
        }
        .correct {
            color: #27ae60;
        }
        .incorrect {
            color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Konkurs Matematyczny Leon - Klasa II (Wiosna 2024)</h1>
    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" onclick="checkAnswers()">Sprawdź odpowiedzi</button>
    </form>
    <div id="result"></div>
</div>

<script>
const quizData = [
    { id: 1, text: "1. Ile centymetrów brakuje do metra? (16 cm + 56 cm oraz 11 cm + 48 cm)[span_6](start_span)[span_6](end_span)", options: { A: "26 cm (do pierwszego)", B: "28 cm (do pierwszego)", C: "40 cm (do drugiego)", D: "41 cm (do drugiego)" }, correct: ["B", "D"], multiple: true },
    { id: 2, text: "2. Patryk ma 16 lat, a Adaś 7. Oblicz, o ile lat Adaś jest młodszy od Patryka[span_7](start_span)[span_7](end_span).", options: { A: "7 lat", B: "9 lat", C: "8 lat", D: "10 lat" }, correct: ["B"], multiple: false },
    { id: 3, text: "3. Jest godzina 9.55. Która godzina będzie za 2 kwadranse?[span_8](start_span)[span_8](end_span)", options: { A: "10.35", B: "10.40", C: "10.25", D: "10.10" }, correct: ["C"], multiple: false },
    { id: 4, text: "4. Wskaż prawidłowe odpowiedzi (Kwadrans, Pół kilograma, Półtorej metra)[span_9](start_span)[span_9](end_span).", options: { A: "15 min", B: "60 min", C: "50 dag", D: "500 dag", E: "150 cm", F: "15 cm" }, correct: ["A", "C", "E"], multiple: true },
    { id: 5, text: "5. Ustal, jakie wartości mogły się ukryć pod motylkami[span_10](start_span)[span_10](end_span).", options: { A: "27 (dla pierwszego warunku < 38)", B: "56 (7 * 8)", C: "9 (42:6 < )", D: "36 (42:6 < )" }, correct: ["A", "B", "C", "D"], multiple: true },
    { id: 6, text: "6. Oblicz różnicę liczb: 63 i 29[span_11](start_span)[span_11](end_span).", options: { A: "36", B: "34", C: "46", D: "35" }, correct: ["B"], multiple: false },
    { id: 7, text: "7. Wczoraj była środa. Pojutrze będzie[span_12](start_span)[span_12](end_span):", options: { A: "niedziela", B: "piątek", C: "sobota", D: "poniedziałek" }, correct: ["C"], multiple: false },
    { id: 8, text: "8. Marta ma kilka patyczków jednakowej długości. Z ilu patyczków może zbudować 2 trójkąty (wspólny bok)?[span_13](start_span)[span_13](end_span)", options: { A: "3", B: "5", C: "1", D: "brak odpowiedzi" }, correct: ["B"], multiple: false },
    { id: 9, text: "9. Wskaż liczbę, która ma więcej jedności niż dziesiątek[span_14](start_span)[span_14](end_span).", options: { A: "89", B: "98", C: "75", D: "36" }, correct: ["A", "D"], multiple: true },
    { id: 10, text: "10. Każdy kwiatek zastępuje tę samą liczbę w równaniu 45 - kwiatek = 30[span_15](start_span)[span_15](end_span). Jaka to liczba?", options: { A: "15", B: "6", C: "5", D: "4" }, correct: ["A"], multiple: false },
    { id: 11, text: "11. Ile to miesięcy? 3 kwartały[span_16](start_span)[span_16](end_span).", options: { A: "3", B: "12", C: "9", D: "6" }, correct: ["C"], multiple: false },
    { id: 12, text: "12. Od godziny 20.10 do godziny 21.05 minęło[span_17](start_span)[span_17](end_span)?", options: { A: "60 minut", B: "45 minut", C: "55 minut", D: "50 minut" }, correct: ["C"], multiple: false },
    { id: 13, text: "13. Wstaw odpowiednie znaki (<, =, >) dla porównań pieniężnych[span_18](start_span)[span_18](end_span).", options: { A: "8 zł < 10 zł", B: "25 zł > 23 zł", C: "16 zł < 17 zł" }, correct: ["A", "B", "C"], multiple: true },
    { id: 14, text: "14. Wskaż składniki sumy równej 20[span_19](start_span)[span_19](end_span).", options: { A: "12 + 3 + 5", B: "14 + 6", C: "11 + 6 + 2", D: "3 + 4 + 3" }, correct: ["A", "B"], multiple: true },
    { id: 15, text: "15. Zaznacz błędne obliczenia[span_20](start_span)[span_20](end_span).", options: { A: "73 + 8 = 82", B: "5 + 9 = 45", C: "35 + 7 = 93", D: "42 + 8 = 50" }, correct: ["A", "B", "C"], multiple: true },
    { id: 16, text: "16. Wstążka ma długość 20 cm. Ile cm ma każda z 4 równych części[span_21](start_span)[span_21](end_span)?", options: { A: "4 cm", B: "5 cm", C: "3 cm", D: "6 cm" }, correct: ["B"], multiple: false },
    { id: 17, text: "17. Wskaż rzeczy, które występują zawsze w parach[span_22](start_span)[span_22](end_span).", options: { A: "szaliki", B: "buty", C: "skarpetki", D: "rękawiczki" }, correct: ["B", "C", "D"], multiple: true },
    { id: 18, text: "18. Jedna biedronka siedmiokropka ma 7 kropek. Ile kropek mają cztery takie biedronki[span_23](start_span)[span_23](end_span)?", options: { A: "28", B: "35", C: "7", D: "21" }, correct: ["A"], multiple: false },
    { id: 19, text: "19. Karol spędził tydzień ferii nad morzem i 3 dni w górach. Ile to dni[span_24](start_span)[span_24](end_span)?", options: { A: "14 dni", B: "3 dni", C: "7 dni", D: "10 dni" }, correct: ["D"], multiple: false },
    { id: 20, text: "20. Wskaż liczby parzyste większe od 20, ale mniejsze od 30[span_25](start_span)[span_25](end_span).", options: { A: "20", B: "30", C: "26", D: "28" }, correct: ["C", "D"], multiple: true },
    { id: 21, text: "21. Porównaj sumy i różnice (prawidłowe relacje)[span_26](start_span)[span_26](end_span).", options: { A: "49-9 = 50-10", B: "85+5 > 85-5", C: "98-18 < 33+48" }, correct: ["A", "B", "C"], multiple: true },
    { id: 22, text: "22. Worek z mąką waży 25 kg. Pusty worek jest o 23 kg lżejszy. Ile waży worek[span_27](start_span)[span_27](end_span)?", options: { A: "23 kg", B: "2 kg", C: "25 kg", D: "1 kg" }, correct: ["B"], multiple: false },
    { id: 23, text: "23. Wskaż iloczyny, które mają takie same wyniki[span_28](start_span)[span_28](end_span).", options: { A: "2 · 2", B: "4 · 1", C: "3 · 0", D: "2 · 3" }, correct: ["A", "B"], multiple: true },
    { id: 24, text: "24. Oblicz sumę liczb: dwadzieścia osiem i dziewięć[span_29](start_span)[span_29](end_span).", options: { A: "37", B: "28", C: "9", D: "19" }, correct: ["A"], multiple: false },
    { id: 25, text: "25. Wskaż szereg uporządkowany od najmniejszej do największej[span_30](start_span)[span_30](end_span).", options: { A: "trzydzieści, sześćdziesiąt, osiemdziesiąt", B: "dziesięć, pięćdziesiąt, dziewięćdziesiąt", C: "czterdzieści, trzydzieści, siedemdziesiąt", D: "dwadzieścia, sto, sześćdziesiąt" }, correct: ["A", "B"], multiple: true }
];

function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach(q => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'task';
        
        let optionsHTML = '';
        const inputType = q.multiple ? 'checkbox' : 'radio';

        for (const [key, value] of Object.entries(q.options)) {
            optionsHTML += `
                <label id="label_q${q.id}_${key}">
                    <input type="${inputType}" name="q${q.id}" value="${key}">
                    ${key}. ${value}
                </label>
            `;
        }

        taskDiv.innerHTML = `
            <div class="task-title">${q.text}</div>
            <div class="options">${optionsHTML}</div>
        `;
        container.appendChild(taskDiv);
    });
}

function checkAnswers() {
    let score = 0;

    quizData.forEach(q => {
        for (const key of Object.keys(q.options)) {
            const lbl = document.getElementById(`label_q${q.id}_${key}`);
            lbl.classList.remove('correct-answer', 'incorrect-answer');
        }

        const selectedElements = document.querySelectorAll(`input[name="q${q.id}"]:checked`);
        const userAnswers = Array.from(selectedElements).map(el => el.value);

        for (const key of Object.keys(q.options)) {
            const lbl = document.getElementById(`label_q${q.id}_${key}`);
            const isSelected = userAnswers.includes(key);
            const isActuallyCorrect = q.correct.includes(key);

            if (isActuallyCorrect) {
                lbl.classList.add('correct-answer');
            } else if (isSelected && !isActuallyCorrect) {
                lbl.classList.add('incorrect-answer');
            }
        }

        const isCorrect = userAnswers.length === q.correct.length && 
                          userAnswers.every(val => q.correct.includes(val));

        if (isCorrect) {
            score++;
        }
    });

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `Twój wynik to: ${score} / ${quizData.length}`;
    resultDiv.className = score === quizData.length ? 'correct' : 'incorrect';
}

renderQuiz();
</script>

</body>
</html>
