<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprawdzian z Matematyki - Klasa IV (Wiosna 2024)</title>
    <style>
        /* Stylizacja wyglądu strony */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .task {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .task-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
            cursor: pointer;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #219150;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
        }
        .correct {
            color: #27ae60;
        }
        .incorrect {
            color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Konkurs Matematyczny Leon - Klasa IV</h1>
    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" onclick="checkAnswers()">Sprawdź odpowiedzi</button>
    </form>
    <div id="result"></div>
</div>

<script>
// Dane dotyczące zadań i poprawnych odpowiedzi
const quizData = [
    { id: 1, text: "1. Liczba o 20 większa od ilorazu liczby 120 : 6 wynosi:", options: { A: "0", B: "20", C: "40", D: "60" }, correct: ["C"], multiple: false },
    { id: 2, text: "2. Iloczyn 5 · 5 · 5 · 5 możemy zapisać w postaci:", options: { A: "5⁴", B: "55", C: "55²", D: "4⁵" }, correct: ["A"], multiple: false },
    { id: 3, text: "3. Jeśli średnica okręgu ma długość 10 dm, to długość jego promienia wynosi:", options: { A: "40 dm", B: "20 dm", C: "10 dm", D: "5 dm" }, correct: ["D"], multiple: false },
    { id: 4, text: "4. Długość odcinka AB w skali 3:1 wynosi 4 cm, wobec tego ten odcinek ma długość:", options: { A: "3 cm", B: "4 cm", C: "12 cm", D: "34 cm" }, correct: ["C"], multiple: false },
    { id: 5, text: "5. Obwód narysowanego trójkąta (boki: 1 dm, 6 cm, 8 cm) wynosi:", options: { A: "14 cm", B: "15 cm", C: "24 cm", D: "48 cm" }, correct: ["C"], multiple: false },
    { id: 6, text: "6. Kąt o mierze 89° jest:", options: { A: "kątem ostrym", B: "kątem prostym", C: "kątem rozwartym", D: "kątem półpełnym" }, correct: ["A"], multiple: false },
    { id: 7, text: "7. Pole kwadratu o obwodzie 16 cm wynosi:", options: { A: "16 cm²", B: "8 cm²", C: "64 cm²", D: "32 cm²" }, correct: ["A"], multiple: false },
    { id: 8, text: "8. Odległość w rzeczywistości wynosi 2000 cm, w skali 1:100 ta odległość będzie miała długość:", options: { A: "2 cm", B: "20 cm", C: "2000 cm", D: "200000 cm" }, correct: ["B"], multiple: false },
    { id: 9, text: "9. 250 minut to:", options: { A: "2 godziny i 5 minut", B: "2 godziny i 10 minut", C: "2 godziny i 50 minut", D: "4 godziny i 10 minut" }, correct: ["D"], multiple: false },
    { id: 10, text: "10. Liczba 5 razy mniejsza od 555 to:", options: { A: "500", B: "111", C: "155", D: "550" }, correct: ["B"], multiple: false },
    { id: 11, text: "11. Różnica największej dwucyfrowej liczby i najmniejszej dwucyfrowej wynosi:", options: { A: "89", B: "100", C: "110", D: "989" }, correct: ["A"], multiple: false },
    { id: 12, text: "12. Kwadrat liczby 9 pomniejszony o 9 wynosi:", options: { A: "0", B: "9", C: "72", D: "81" }, correct: ["C"], multiple: false },
    { id: 13, text: "13. Wynik działania 1 2/17 - 2 3/4 wynosi:", options: { A: "1 1/68", B: "1 1/13", C: "13", D: "1" }, correct: ["A"], multiple: false },
    { id: 14, text: "14. Wspólną wielokrotnością liczb 2, 3 oraz 8 jest:", options: { A: "238", B: "13", C: "24", D: "832" }, correct: ["C"], multiple: false },
    { id: 15, text: "15. Iloraz liczb 250 i 50 wynosi:", options: { A: "50", B: "5", C: "300", D: "750" }, correct: ["B"], multiple: false },
    { id: 16, text: "16. Obwód podanego trójkąta (boki: 25 cm, 25 cm, 13 cm) wynosi:", options: { A: "38 cm", B: "50 cm", C: "63 cm", D: "75 cm" }, correct: ["C"], multiple: false },
    { id: 17, text: "17. Liczba setek w sumie liczb 187 i 113 wynosi:", options: { A: "1", B: "2", C: "3", D: "4" }, correct: ["C"], multiple: false },
    { id: 18, text: "18. Wynikiem działania 10 - 4 : 2 jest liczba:", options: { A: "3", B: "6", C: "8", D: "10" }, correct: ["C"], multiple: false },
    { id: 19, text: "19. W sali kinowej jest 10 rzędów po 12 miejsc i 5 miejsc specjalnych. Miejsc jest:", options: { A: "125 miejsc", B: "120 miejsc", C: "60 miejsc", D: "12 miejsc" }, correct: ["A"], multiple: false },
    { id: 20, text: "20. Osiem kwadransów to:", options: { A: "80 minut", B: "100 minut", C: "120 minut", D: "800 minut" }, correct: ["C"], multiple: false },
    
    // ZADANIA WIELOKROTNEGO WYBORU
    { id: 21, text: "21. Liczby większe od 47 to: (wielokrotny wybór)", options: { A: "XXVIII", B: "L", C: "XLIX", D: "XXIII" }, correct: ["B", "C"], multiple: true },
    { id: 22, text: "22. Które nierówności są prawidłowe? (wielokrotny wybór)", options: { A: "1548 - 500 > 1000", B: "2400 : 600 > 5", C: "4874 - 800 > 5000", D: "250 : 50 > 60" }, correct: ["A"], multiple: true },
    { id: 23, text: "23. Które liczby są większe od 0,4? (wielokrotny wybór)", options: { A: "0,397", B: "0,401", C: "0,098", D: "0,674" }, correct: ["B", "D"], multiple: true },
    { id: 24, text: "24. Które działania dają wynik 25? (wielokrotny wybór)", options: { A: "1600 : 64", B: "5²", C: "125 : 25", D: "625 - 500" }, correct: ["A", "B"], multiple: true },
    { id: 25, text: "25. Ćwierć kilograma to inaczej: (wielokrotny wybór)", options: { A: "250 g", B: "25 dag", C: "0,25 kg", D: "2,5 kg" }, correct: ["A", "B", "C"], multiple: true },
    { id: 26, text: "26. Które lata były w XIV wieku? (wielokrotny wybór)", options: { A: "1300", B: "1301", C: "1299", D: "1400" }, correct: ["B", "D"], multiple: true },
    { id: 27, text: "27. Nieparzyste wyniki dają działania: (wielokrotny wybór)", options: { A: "444 : 44", B: "150 : 150", C: "24 : 4", D: "400 : 50" }, correct: ["B"], multiple: true },
    { id: 28, text: "28. Odcinek o długości 2 cm narysowany w skali 100:1 będzie miał długość: (wielokrotny wybór)", options: { A: "120 cm", B: "1,2 m", C: "200 cm", D: "2 m" }, correct: ["C", "D"], multiple: true },
    { id: 29, text: "29. Które kąty mogą być kątami równoległoboku? (wielokrotny wybór)", options: { A: "100°, 100°, 20°, 20°", B: "135°, 135°, 45°, 45°", C: "165°, 165°, 15°, 15°", D: "88°, 88°, 12°, 12°" }, correct: ["B", "C"], multiple: true }
];

// Generowanie formularza z pytaniami
function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach(q => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'task';
        
        let optionsHTML = '';
        const inputType = q.multiple ? 'checkbox' : 'radio';

        for (const [key, value] of Object.entries(q.options)) {
            optionsHTML += `
                <label>
                    <input type="${inputType}" name="q${q.id}" value="${key}">
                    ${key}. ${value}
                </label>
            `;
        }

        taskDiv.innerHTML = `
            <div class="task-title">${q.text}</div>
            <div class="options">${optionsHTML}</div>
        `;
        container.appendChild(taskDiv);
    });
}

// Sprawdzanie odpowiedzi
function checkAnswers() {
    let score = 0;

    quizData.forEach(q => {
        const selectedElements = document.querySelectorAll(`input[name="q${q.id}"]:checked`);
        const userAnswers = Array.from(selectedElements).map(el => el.value);

        // Porównujemy wybrane odpowiedzi z poprawnymi
        const isCorrect = userAnswers.length === q.correct.length && 
                          userAnswers.every(val => q.correct.includes(val));

        if (isCorrect) {
            score++;
        }
    });

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `Twój wynik to: ${score} / ${quizData.length}`;
    resultDiv.className = score === quizData.length ? 'correct' : 'incorrect';
}

// Inicjalizacja przy załadowaniu strony
renderQuiz();
</script>

</body>
</html>
