<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karta Odpowiedzi – Konkurs Matematyczny Leon</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success-bg: #dcfce7;
            --success-border: #86efac;
            --success-text: #166534;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 0.8rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary);
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Lewy panel – Podgląd pliku PDF */
        .pdf-viewer-container {
            flex: 1;
            border-right: 1px solid var(--border);
            background-color: #525659;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #323639;
            color: #fff;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .toolbar select {
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            border: none;
            background: #fff;
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
        }

        .pdf-viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Prawy panel – Karta odpowiedzi */
        .answer-card {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow-y: auto;
            background-color: var(--card-bg);
        }

        .student-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.2rem;
            padding: 0.8rem;
            background: #f1f5f9;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .student-info input {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            text-transform: uppercase;
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .question-item {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fafafa;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .question-item label.q-num {
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 80px;
        }

        .options {
            display: flex;
            gap: 0.8rem;
        }

        .options label {
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        button.btn-submit {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--primary-hover);
        }

        /* Sekcja wyników AI */
        #ai-result {
            margin-top: 1.2rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
        }

        .result-success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
            font-style: italic;
            color: #64748b;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .pdf-viewer-container {
                height: 45vh;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Karta Odpowiedzi – Konkurs Matematyczny Leon</h1>
        <span>Weryfikacja przez AI 🤖</span>
    </header>

    <div class="container">
        <!-- Lewy panel: Podgląd arkusza PDF -->
        <div class="pdf-viewer-container">
            <div class="toolbar">
                <label for="pdfSelector">Wybierz arkusz zadań:</label>
                <select id="pdfSelector" onchange="updateSheet()">
                    <option value="k1">Klasa 1 – Wiosna 2025 (25 zadań)</option>
                    <option value="k2">Klasa 2 – Wiosna 2025 (25 zadań)</option>
                    <option value="k3" selected>Klasa 3 – Wiosna 2025 (26 zadań)</option>
                    <option value="k4">Klasa 4 – Wiosna 2025 (25 zadań)</option>
                </select>
            </div>
            <iframe id="pdfFrame" src="https://drive.google.com/file/d/1d5uqyxEFghwiZTNo11R74WFCcA-hbMJR/preview" allow="autoplay"></iframe>
        </div>

        <!-- Prawy panel: Karta odpowiedzi -->
        <div class="answer-card">
            <h2 id="sheetTitle">Karta Odpowiedzi – Klasa 3</h2>
            <form id="quiz-form">
                
                <div class="student-info">
                    <div>
                        <label for="imie" style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:0.2rem;">Imię (DRUKOWANE):</label>
                        <input type="text" id="imie" name="imie" required placeholder="np. JAN">
                    </div>
                    <div>
                        <label for="nazwisko" style="font-size:0.8rem; font-weight:600; display:block; margin-bottom:0.2rem;">Nazwisko (DRUKOWANE):</label>
                        <input type="text" id="nazwisko" name="nazwisko" required placeholder="np. KOWALSKI">
                    </div>
                </div>

                <!-- Kontener na dynamicznie generowane pytania -->
                <div id="questionsContainer" class="questions-grid"></div>

                <button type="submit" class="btn-submit">Wyślij do sprawdzenia przez AI</button>
            </form>

            <div id="loading" class="loading">Sztuczna inteligencja sprawdzająca arkusz... ⏳</div>
            <div id="ai-result"></div>
        </div>
    </div>

    <script>
        // Konfiguracja arkuszy dla poszczególnych klas
        const sheetsData = {
            k1: {
                title: "Karta Odpowiedzi – Klasa 1 (Wiosna 2025)",
                url: "https://drive.google.com/file/d/1v6tfz03foWk1hHc3Zcvp5MsBPwrbPb2F/preview",
                totalQuestions: 25
            },
            k2: {
                title: "Karta Odpowiedzi – Klasa 2 (Wiosna 2025)",
                url: "https://drive.google.com/file/d/11O_GoCPRoSZAIKNK5rFmtqm7Q6ulOP0P/preview",
                totalQuestions: 25
            },
            k3: {
                title: "Karta Odpowiedzi – Klasa 3 (Wiosna 2025)",
                url: "https://drive.google.com/file/d/1d5uqyxEFghwiZTNo11R74WFCcA-hbMJR/preview",
                totalQuestions: 26
            },
            k4: {
                title: "Karta Odpowiedzi – Klasa 4 (Wiosna 2025)",
                url: "https://drive.google.com/file/d/1Kuztm9mSARFrYd7RdG6JFd6qGTFS80Uk/preview",
                totalQuestions: 25
            }
        };

        // Generowanie pola pytań w karcie odpowiedzi
        function renderQuestions(total) {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            for (let i = 1; i <= total; i++) {
                const item = document.createElement('div');
                item.className = 'question-item';
                
                item.innerHTML = `
                    <label class="q-num">Zadanie ${i}:</label>
                    <div class="options">
                        <label><input type="checkbox" name="q${i}" value="A"> A</label>
                        <label><input type="checkbox" name="q${i}" value="B"> B</label>
                        <label><input type="checkbox" name="q${i}" value="C"> C</label>
                        <label><input type="checkbox" name="q${i}" value="D"> D</label>
                    </div>
                `;
                container.appendChild(item);
            }
        }

        // Zmiana arkusza po wyborze z listy
        function updateSheet() {
            const selectedKey = document.getElementById('pdfSelector').value;
            const data = sheetsData[selectedKey];

            document.getElementById('pdfFrame').src = data.url;
            document.getElementById('sheetTitle').innerText = data.title;
            renderQuestions(data.totalQuestions);

            // Ukrycie poprzedniego wyniku AI
            document.getElementById('ai-result').style.display = 'none';
        }

        // Inicjalizacja domyślnego arkusza (Klasa 3)
        renderQuestions(sheetsData.k3.totalQuestions);

        // Obsługa wysyłania odpowiedzi i symulacja analizy AI
        document.getElementById('quiz-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('ai-result');

            loading.style.display = 'block';
            resultDiv.style.display = 'none';

            const formData = new FormData(this);
            const imie = formData.get('imie');
            const nazwisko = formData.get('nazwisko');
            const selectedKey = document.getElementById('pdfSelector').value;
            const total = sheetsData[selectedKey].totalQuestions;

            // Liczenie uzupełnionych odpowiedzi
            let answeredCount = 0;
            for (let i = 1; i <= total; i++) {
                if (formData.getAll(`q${i}`).length > 0) {
                    answeredCount++;
                }
            }

            // Symulacja sprawdzenia przez AI
            setTimeout(() => {
                loading.style.display = 'none';
                
                resultDiv.className = 'result-success';
                resultDiv.innerHTML = `
                    <h3>Wynik sprawdzenia AI</h3>
                    <p style="margin-top:0.4rem;"><strong>Uczeń:</strong> ${imie} ${nazwisko}</p>
                    <p><strong>Uzupełnione zadania:</strong> ${answeredCount} / ${total}</p>
                    <p><strong>Ocena szacowana przez AI:</strong> Bardzo dobry (${Math.round((answeredCount/total)*100)}% rozwiązanych)</p>
                    <p style="margin-top:0.5rem; font-size:0.85rem;"><em>AI: Arkusz został pomyślnie przetworzony i wysłany do sprawdzenia.</em></p>
                `;
                resultDiv.style.display = 'block';
            }, 1800);
        });
    </script>
</body>
</html>
