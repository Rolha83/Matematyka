<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprawdzian z Matematyki - Klasa III (Wiosna 2024)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .task {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fafafa;
        }
        .task-title {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .options label {
            display: block;
            margin-bottom: 5px;
            padding: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Style do oznaczania odpowiedzi po sprawdzeniu */
        .correct-answer {
            background-color: #d4edda !important;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .incorrect-answer {
            background-color: #f8d7da !important;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #219150;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
        }
        .correct {
            color: #27ae60;
        }
        .incorrect {
            color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Konkurs Matematyczny Leon - Klasa III</h1>
    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" onclick="checkAnswers()">Sprawdź odpowiedzi</button>
    </form>
    <div id="result"></div>
</div>

<script>
// Baza danych zadań oparta na arkuszu konkursowym dla klasy III
const quizData = [
    { id: 1, text: "1. Wskaż równość prawdziwą.", options: { A: "36 : 9 = 28 : 7", B: "4 : 4 = 54 : 8", C: "63 : 7 = 27 : 3", D: "48 : 6 = 4 · 2" }, correct: ["A", "D"], multiple: true },
    { id: 2, text: "2. Wskaż zamalowaną ćwierć kwadratu.", options: { A: "Opcja A (1/4)", B: "Opcja B", C: "Opcja C", D: "Opcja D" }, correct: ["A"], multiple: false },
    { id: 3, text: "3. Staś ma 9 lat, a Kacper 26. Oblicz, o ile lat Kacper jest starszy od Stasia.", options: { A: "17 lat", B: "16 lat", C: "35 lat", D: "18 lat" }, correct: ["A"], multiple: false },
    { id: 4, text: "4. Wskaż działanie niewykonalne.", options: { A: "5 : 0", B: "0 : 5", C: "5 · 0", D: "0 · 5" }, correct: ["A"], multiple: false },
    { id: 5, text: "5. Ustal, jakie wartości kryją się pod motylkami: (37 + = 100, - 48 = 27, 49 + 35 = )", options: { A: "63, 75, 84", B: "64, 75, 84", C: "63, 74, 85", D: "63, 75, 86" }, correct: ["A"], multiple: false },
    { id: 6, text: "6. Miesiąc IX (wrzesień) ma:", options: { A: "30 dni", B: "28 dni", C: "29 dni", D: "31 dni" }, correct: ["A"], multiple: false },
    { id: 7, text: "7. Jest godzina 8.45. Która godzina będzie za półtorej godziny?", options: { A: "9.45", B: "10.45", C: "10.15", D: "10.30" }, correct: ["C"], multiple: false },
    { id: 8, text: "8. Przedwczoraj był piątek. Pojutrze będzie:", options: { A: "środa", B: "poniedziałek", C: "wtorek", D: "czwartek" }, correct: ["C"], multiple: false },
    { id: 9, text: "9. Wskaż liczbę złożoną z 4 setek, 3 dziesiątek i 8 jedności.", options: { A: "438", B: "834", C: "483", D: "348" }, correct: ["A"], multiple: false },
    { id: 10, text: "10. Wskaż iloczyny, które mają takie same wyniki. (2·9 = 18, 3·6 = 18, 7·3 = 21, 5·4 = 20)", options: { A: "2 · 9", B: "3 · 6", C: "7 · 3", D: "5 · 4" }, correct: ["A", "B"], multiple: true },
    { id: 11, text: "11. Marek miał 9 monet po 5 zł. Kupił notes za 6 zł i długopis za 13 zł. Ile złotych zostało Markowi?", options: { A: "33 zł", B: "9 zł", C: "13 zł", D: "26 zł" }, correct: ["D"], multiple: false },
    { id: 12, text: "12. Oblicz i wskaż działania z takimi samymi wynikami. (100:2=50, 23+27=50, 80-30=50, 75-26=49)", options: { A: "100 : 2", B: "23 + 27", C: "80 - 30", D: "75 - 26" }, correct: ["A", "B", "C"], multiple: true },
    { id: 13, text: "13. Zmniejszyć liczbę 24 trzy razy, to znaczy:", options: { A: "pomnożyć ją przez 3", B: "podzielić ją przez 3", C: "odjąć od niej 3", D: "dodać do niej 3" }, correct: ["B"], multiple: false },
    { id: 14, text: "14. Jaka liczba ukryła się pod kwiatkiem? (27 : 9 = 3)", options: { A: "27", B: "36", C: "28", D: "24" }, correct: ["A"], multiple: false },
    { id: 15, text: "15. Rodzice Marty mają razem pół wieku (50 lat). Mama Marty jest młodsza od taty i ma 23 lata. Ile lat ma tata Marty?", options: { A: "23 lata", B: "27 lat", C: "26 lat", D: "28 lat" }, correct: ["B"], multiple: false },
    { id: 16, text: "16. Ma początek, ale nie ma końca.", options: { A: "półprosta", B: "odcinek", C: "prosta", D: "punkt" }, correct: ["A"], multiple: false },
    { id: 17, text: "17. Wskaż szereg, w którym liczby zostały uporządkowane od najmniejszej do największej.", options: { A: "12 434, 9 872, 71 602, 38 432", B: "8 574, 45 678, 76 521, 10 736", C: "5 864, 13 897, 38 655, 79 321", D: "7 321, 8 933, 13 762, 2 345" }, correct: ["C"], multiple: false },
    { id: 18, text: "18. Jak można podzielić 36 ciastek między sześcioro dzieci?", options: { A: "1+3+5+7+9+11", B: "2+4+6+8+10+12", C: "6 · 6", D: "2+3+7+8+6+9" }, correct: ["B", "C"], multiple: true },
    { id: 19, text: "19. Wskaż liczby, których połowa jest liczbą parzystą. (72/2=36 parzysta, 84/2=42 parzysta)", options: { A: "72", B: "66", C: "50", D: "84" }, correct: ["A", "D"], multiple: true },
    { id: 20, text: "20. Długość skoku kangura wynosi dziewięć metrów. Ile takich skoków musi wykonać kangur, żeby pokonać odległość 81 metrów?", options: { A: "6", B: "8", C: "9", D: "7" }, correct: ["C"], multiple: false },
    { id: 21, text: "21. Od iloczynu liczb 6 i 8 odejmij ich sumę. (6*8 = 48, 6+8 = 14, 48 - 14 = 34)", options: { A: "14", B: "42", C: "40", D: "34" }, correct: ["D"], multiple: false },
    { id: 22, text: "22. Wskaż liczby trzycyfrowe parzyste, w których rząd setek to dziewięć, a rząd jedności to osiem.", options: { A: "998", B: "989", C: "898", D: "908" }, correct: ["A", "D"], multiple: true },
    { id: 23, text: "23. Ile razem nóg mają 3 tygrysy, 4 lwy i 2 papugi? ((3+4)*4 + 2*2 = 28 + 4 = 32)", options: { A: "32", B: "16", C: "9", D: "22" }, correct: ["A"], multiple: false },
    { id: 24, text: "24. Zosia spędziła dwa tygodnie ferii zimowych u babci na wsi. Ile to dni?", options: { A: "28 dni", B: "21 dni", C: "7 dni", D: "14 dni" }, correct: ["D"], multiple: false },
    { id: 25, text: "25. Ile wynosi długość drogi liska? (27 + 25 + 9 + 12 + 6 = 79 cm)", options: { A: "80 cm", B: "78 cm", C: "79 cm", D: "77 cm" }, correct: ["C"], multiple: false }
];

// Generowanie formularza z pytaniami
function renderQuiz() {
    const container = document.getElementById('questionsContainer');
    quizData.forEach(q => {
        const taskDiv = document.createElement('div');
        taskDiv.className = 'task';
        
        let optionsHTML = '';
        const inputType = q.multiple ? 'checkbox' : 'radio';

        for (const [key, value] of Object.entries(q.options)) {
            optionsHTML += `
                <label id="label_q${q.id}_${key}">
                    <input type="${inputType}" name="q${q.id}" value="${key}">
                    ${key}. ${value}
                </label>
            `;
        }

        taskDiv.innerHTML = `
            <div class="task-title">${q.text}</div>
            <div class="options">${optionsHTML}</div>
        `;
        container.appendChild(taskDiv);
    });
}

// Sprawdzanie odpowiedzi i kolorowanie wyników
function checkAnswers() {
    let score = 0;

    quizData.forEach(q => {
        // Najpierw resetujemy klasy stylów dla tego pytania
        for (const key of Object.keys(q.options)) {
            const lbl = document.getElementById(`label_q${q.id}_${key}`);
            lbl.classList.remove('correct-answer', 'incorrect-answer');
        }

        const selectedElements = document.querySelectorAll(`input[name="q${q.id}"]:checked`);
        const userAnswers = Array.from(selectedElements).map(el => el.value);

        // Kolorujemy odpowiedzi zgodnie z kluczem
        for (const key of Object.keys(q.options)) {
            const lbl = document.getElementById(`label_q${q.id}_${key}`);
            const isSelected = userAnswers.includes(key);
            const isActuallyCorrect = q.correct.includes(key);

            if (isActuallyCorrect) {
                // Prawidłowa odpowiedź zawsze podświetla się na zielono
                lbl.classList.add('correct-answer');
            } else if (isSelected && !isActuallyCorrect) {
                // Jeśli użytkownik zaznaczył coś błędnie, podświetlamy na czerwono
                lbl.classList.add('incorrect-answer');
            }
        }

        // Sprawdzamy, czy cały zestaw odpowiedzi użytkownika jest w 100% poprawny
        const isCorrect = userAnswers.length === q.correct.length && 
                          userAnswers.every(val => q.correct.includes(val));

        if (isCorrect) {
            score++;
        }
    });

    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `Twój wynik to: ${score} / ${quizData.length}`;
    resultDiv.className = score === quizData.length ? 'correct' : 'incorrect';
}

// Inicjalizacja przy ładowaniu strony
renderQuiz();
</script>

</body>
</html>
